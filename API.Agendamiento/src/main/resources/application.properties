spring.application.name=agendamiento
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/agendamientos_db
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.profiles.active=dev

# URLs CORREGIDAS
usuarios.service.url=http://localhost:8081/api/v1/usuarios
horarios.service.url=http://localhost:8082/api/v1/horarios


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html