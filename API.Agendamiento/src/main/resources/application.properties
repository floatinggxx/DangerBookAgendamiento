# Nombre de la aplicacion
spring.application.name=Agendamiento-API

# Puerto del servidor
server.port=8080

# Configuracion H2 Database
spring.datasource.url=jdbc:h2:mem:agendadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuracion JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URLs de otros microservicios (ajustar segun tu configuracion)
# usuarios.service.url=http://localhost:8081/api/usuarios
# horarios.service.url=http://localhost:8082/api/horarios

# Profile activo
spring.profiles.active=dev

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html